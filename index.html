<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lärmwächter">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">

<body>
<title>Lärmwächter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Vazirmatn:wght@500;700&display=swap">
<style>
/* Layout: a swipeable night scene with five sleeping animals on top, the kid panel below; tablets in landscape put them side by side */
:root{
  --sky:#1A2847; --sky2:#2A3D68; --ink:#F7F2E6; --ink-soft:#BFC8DD;
  --moon:#FFE6A1; --calm:#7FD08A; --hmm:#FFC94D; --loud:#FF6E5E;
  --owl:#A27A5A; --owl-dark:#7D5A42; --belly:#EDD9B6; --face:#F6E9D0; --eye:#1E2A44; --beak:#F4A43A;
  --card:#FFFBF2; --card-ink:#243250; --card-soft:#6A7591; --card-line:#E8DFCB; --accent:#2F6FB0;
  --f-display:"Fredoka","Vazirmatn","Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body[data-animal="cat"]{--sky:#2A2144;--sky2:#4B3670}
body[data-animal="bear"]{--sky:#12302A;--sky2:#225242}
body[data-animal="frog"]{--sky:#0F2E3A;--sky2:#1C5864}
body[data-animal="bunny"]{--sky:#33263F;--sky2:#6E4B66}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.sky{position:fixed;inset:0;background:radial-gradient(120% 80% at 80% 0%,var(--sky2) 0%,var(--sky) 60%);z-index:0}
.glow{position:fixed;inset:0;background:radial-gradient(70% 55% at 50% 40%,color-mix(in srgb,var(--loud) 55%,transparent),transparent 70%);opacity:0;transition:opacity .4s;z-index:0;pointer-events:none}
body.is-alarm .glow{opacity:1}
.app{position:relative;z-index:1;min-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;max-width:1200px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;color:var(--ink-soft)}
h1 b{color:var(--ink);font-weight:700}

.gear{position:relative;width:52px;height:52px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink);cursor:pointer;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.gear svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.gear .ring circle{fill:none;stroke:var(--moon);stroke-width:4;stroke-dasharray:151;stroke-dashoffset:151;stroke-linecap:round}
.gear.holding .ring circle{transition:stroke-dashoffset 1.2s linear;stroke-dashoffset:0}
.gear:focus-visible{outline:3px solid var(--moon);outline-offset:3px}

/* scene + swipe */
.scene{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px}
.viewport{overflow:hidden;min-height:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.track{display:flex;height:100%;will-change:transform}
.slide{flex:0 0 100%;display:grid;place-items:center;min-width:0;min-height:0}
.critter-svg{width:100%;height:100%;max-height:min(48vh,540px);max-width:540px;display:block}
.picker{display:flex;align-items:center;justify-content:center;gap:14px}
.arrow{width:44px;height:44px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink);font-size:1.4rem;font-weight:800;cursor:pointer;display:grid;place-items:center}
.arrow:disabled{opacity:.25;cursor:default}
.arrow:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--ink) 30%,transparent);border:0;padding:0;cursor:pointer;transition:width .2s,background .2s}
.dot.on{width:26px;border-radius:6px;background:var(--moon)}
@media (min-width:760px) and (orientation:landscape){
  .app{grid-template-columns:1.1fr 1fr;grid-template-rows:auto minmax(0,1fr);column-gap:32px}
  header{grid-column:1/-1}
  .critter-svg{max-height:72vh}
  .panel{align-self:center}
}

/* creature states (shared by all animals) */
.eyes-open,.eyes-peek,.eyes-dizzy,.zzz,.bang,.feathers,.halo,.mouth-open{display:none}
.st-sleep .eyes-closed,.st-idle .eyes-closed{display:inline} .st-sleep .zzz{display:inline}
.st-peek .eyes-closed{display:none} .st-peek .eyes-peek{display:inline}
.st-awake .eyes-closed{display:none} .st-awake .eyes-open{display:inline} .st-awake .bang{display:inline}
.act-dizzy .eyes-open{display:none!important} .act-dizzy .eyes-dizzy{display:inline} .act-dizzy .halo{display:inline}
.act-puff .feathers{display:inline}
.act-roar .mouth-open{display:inline} .act-roar .mouth{display:none}
.critter{transform-box:fill-box;transform-origin:50% 100%}
.wing{transform-box:fill-box;transition:transform .3s}
.wing.l{transform-origin:100% 15%} .wing.r{transform-origin:0% 15%}
.st-awake .wing.l{transform:rotate(38deg)} .st-awake .wing.r{transform:rotate(-38deg)}
.tuft{transition:transform .3s;transform-box:fill-box;transform-origin:50% 100%}
.st-awake .tuft{transform:scaleY(1.25)}
.ear{transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s}
.st-sleep .ear.l,.st-idle .ear.l{transform:rotate(-62deg)} .st-sleep .ear.r,.st-idle .ear.r{transform:rotate(62deg)}
.st-peek .ear.l{transform:rotate(-20deg)}
.tongue{transform-box:fill-box;transform-origin:0% 50%;transform:scaleX(0)}
.throat{transform-box:fill-box;transform-origin:50% 0%}
.foot{transform-box:fill-box;transform-origin:0% 50%}
.moon{transition:fill .4s}
.st-awake .moon{fill:var(--loud)}
@media (prefers-reduced-motion:no-preference){
  .st-sleep .critter-body{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes breathe{50%{transform:scale(1.02,1.035)}}
  .zzz text{animation:float 3s ease-in infinite;opacity:0}
  .zzz text:nth-child(2){animation-delay:1s} .zzz text:nth-child(3){animation-delay:2s}
  @keyframes float{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(18px,-46px)}}
  .twinkle{animation:tw 2.6s ease-in-out infinite} .twinkle:nth-of-type(2n){animation-delay:1.3s}
  @keyframes tw{50%{opacity:.25}}
  .st-awake .wing.l{animation:flapL .35s ease-in-out infinite alternate}
  .st-awake .wing.r{animation:flapR .35s ease-in-out infinite alternate}
  @keyframes flapL{from{transform:rotate(20deg)}to{transform:rotate(48deg)}}
  @keyframes flapR{from{transform:rotate(-20deg)}to{transform:rotate(-48deg)}}
  .st-awake .tail{animation:tail .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 90%}
  @keyframes tail{to{transform:rotate(-14deg)}}

  .act-jump .critter{animation:jump .62s cubic-bezier(.3,.7,.4,1) infinite}
  @keyframes jump{0%,100%{transform:translateY(0) scale(1.08,.92)}15%{transform:translateY(0) scale(.94,1.08)}50%{transform:translateY(-78px) scale(1,1)}85%{transform:translateY(0) scale(1.06,.94)}}
  .act-fall .critter{animation:fall 7s ease-in-out both}
  @keyframes fall{0%{transform:none}6%{transform:translate(6px,-14px) rotate(-8deg)}16%{transform:translate(30px,330px) rotate(70deg)}42%{transform:translate(30px,330px) rotate(70deg)}
    52%{transform:translate(0,120px) rotate(-6deg)}58%{transform:translate(0,140px) rotate(6deg)}66%{transform:translate(0,60px) rotate(-6deg)}72%{transform:translate(0,76px) rotate(6deg)}82%{transform:translate(0,-10px)}90%,100%{transform:none}}
  .act-spin .critter{animation:spin 1.1s cubic-bezier(.5,0,.5,1) infinite;transform-origin:50% 55%}
  @keyframes spin{to{transform:rotate(360deg)}}
  .act-puff .critter{animation:puff 1.4s cubic-bezier(.3,1.6,.5,1) infinite}
  @keyframes puff{0%,100%{transform:scale(1)}35%{transform:scale(1.28,1.22)}60%{transform:scale(1.18)}}
  .feathers ellipse{animation:feather 1.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
  @keyframes feather{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(260deg)}}
  .act-fly .critter{animation:fly 3.2s ease-in-out infinite}
  @keyframes fly{0%,100%{transform:none}20%{transform:translate(-40px,-90px) rotate(-10deg)}45%{transform:translate(50px,-130px) rotate(12deg)}70%{transform:translate(-30px,-60px) rotate(-8deg)}}
  .act-fly .wing.l,.act-fly .wing.r{animation-duration:.14s}
  .act-dizzy .critter{animation:wobble 1.3s ease-in-out infinite}
  @keyframes wobble{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
  .act-dizzy .eyes-dizzy .sp{animation:spinEye 1s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
  @keyframes spinEye{to{transform:rotate(360deg)}}
  .act-dizzy .halo{animation:halo 2.2s linear infinite;transform-box:view-box;transform-origin:160px 44px}
  @keyframes halo{to{transform:rotate(360deg)}}
  .act-stomp .critter{animation:stomp .45s ease-in-out infinite}
  @keyframes stomp{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-18px) rotate(-5deg)}75%{transform:translateY(-18px) rotate(5deg)}}
  .act-roar .critter{animation:roar 1.3s ease-in-out infinite}
  @keyframes roar{0%,100%{transform:scale(1)}40%,70%{transform:scale(1.14) translateY(-6px)}}
  .act-tongue .tongue{animation:tongue .9s ease-in-out infinite}
  @keyframes tongue{0%,100%{transform:scaleX(0)}35%,55%{transform:scaleX(1)}}
  .act-tongue .critter{animation:jump 1.8s cubic-bezier(.3,.7,.4,1) infinite}
  .act-puff .throat{animation:throat .7s ease-in-out infinite alternate}
  @keyframes throat{from{transform:scale(1)}to{transform:scale(1.9,2.4)}}
  .act-thump .critter{animation:thump .32s ease-in-out infinite}
  @keyframes thump{50%{transform:translateY(-8px)}}
  .act-thump .foot{animation:foot .32s ease-in-out infinite}
  @keyframes foot{50%{transform:rotate(-28deg)}}
  .act-hide .critter{animation:hide 7s ease-in-out both}
  @keyframes hide{0%{transform:none}10%,82%{transform:translateY(200px)}100%{transform:none}}
}

/* panel */
.panel{display:grid;gap:14px;min-width:0;text-align:center}
.msg{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,6.2vw,2.7rem);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--ink-soft);margin:-6px 0 0;font-size:clamp(1rem,3.4vw,1.2rem);text-wrap:balance}
.meter{position:relative;height:30px;border-radius:999px;margin:6px 6px 0}
.meter .track2{position:absolute;inset:0;border-radius:999px}
.knob{position:absolute;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.35);left:0;transition:left .12s linear;display:grid;place-items:center}
.knob::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--sky)}
.meter-labels{display:flex;justify-content:space-between;font-weight:800;font-size:.95rem;color:var(--ink-soft);padding:0 4px}
.meter-labels span:nth-child(2){font-variant-numeric:tabular-nums;font-weight:700;opacity:.8}
.stars{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:18px;padding:10px 14px}
.stars .label{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.starrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:30px}
.starrow svg{width:28px;height:28px}
.starrow .more{font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--moon)}
.next{position:relative;width:34px;height:34px}
.next svg{position:absolute;inset:0}
.next .bg{fill:none;stroke:color-mix(in srgb,var(--ink) 20%,transparent);stroke-width:4}
.next .fg{fill:none;stroke:var(--moon);stroke-width:4;stroke-linecap:round;stroke-dasharray:88;stroke-dashoffset:88;transform:rotate(-90deg);transform-origin:50% 50%}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}}
.big{font-family:var(--f-display);font-weight:700;font-size:1.5rem;border:0;border-radius:999px;padding:16px 28px;min-height:64px;cursor:pointer;background:var(--moon);color:var(--card-ink);box-shadow:0 6px 0 color-mix(in srgb,var(--moon) 55%,#6b4d00);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--moon) 55%,#6b4d00)}
.big:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.big.ok{background:var(--ink)}
.err{background:var(--card);color:var(--card-ink);border-radius:16px;padding:12px 14px;text-align:start;font-size:.95rem}
.hint{color:var(--ink-soft);font-size:.82rem;margin:0}

/* parent sheet */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:rgba(10,16,32,.55)}
@media (min-width:640px){.sheet{place-items:center}}
.card{background:var(--card);color:var(--card-ink);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));color-scheme:light}
@media (min-width:640px){.card{border-radius:22px}}
.card h2{font-family:var(--f-display);font-weight:600;font-size:1.4rem;margin:0}
.card h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--card-soft);margin:18px 0 6px;font-weight:800}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--card-line);color:var(--card-ink);font-size:1.3rem;cursor:pointer;flex:none}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.nums div{background:color-mix(in srgb,var(--card-line) 55%,transparent);border-radius:12px;padding:8px}
.nums b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.nums span{font-size:.75rem;color:var(--card-soft)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--card-line)}
.row.first{border-top:0}
.row label{font-weight:700}
.row small{display:block;color:var(--card-soft);font-weight:500;font-size:.8rem}
.row .val{font-family:var(--f-display);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.row select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--card-line);background:#fff;color:var(--card-ink);max-width:60vw}
.sw{width:24px;height:24px;accent-color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{font:inherit;font-weight:800;border-radius:12px;padding:11px 14px;border:1px solid var(--card-line);background:#fff;color:var(--card-ink);cursor:pointer;flex:1 1 140px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.x:focus-visible,.row input:focus-visible,.row select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}
#log{list-style:none;margin:0;padding:0}
#log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--card-line);font-variant-numeric:tabular-nums;font-size:.92rem}
#log li:first-child{border-top:0}
#log .p{font-weight:800;color:#C2402F}
.fine{color:var(--card-soft);font-size:.8rem;margin:8px 0 0}
</style>

<div class="sky" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<div class="app">
  <header>
    <h1><b data-i18n="title">Lärmwächter</b> · <span id="animalName">Eule</span></h1>
    <button class="gear" id="gear" type="button" data-i18n-aria="gear" aria-label="Eltern-Einstellungen">
      <svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/></svg>
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <div class="scene" dir="ltr">
    <div class="viewport" id="viewport" role="group" data-i18n-aria="pick">
      <div class="track" id="trackA">

        <!-- OWL -->
        <div class="slide"><svg class="critter-svg st-idle" data-animal="owl" viewBox="0 0 320 320" role="img">
          <circle class="moon" cx="56" cy="58" r="26" fill="var(--moon)"/>
          <g fill="var(--ink)"><circle class="twinkle" cx="270" cy="34" r="2.4"/><circle class="twinkle" cx="92" cy="22" r="1.8"/><circle class="twinkle" cx="196" cy="30" r="2"/><circle class="twinkle" cx="30" cy="120" r="1.6"/><circle class="twinkle" cx="292" cy="130" r="2.2"/><circle class="twinkle" cx="140" cy="14" r="1.5"/></g>
          <rect x="14" y="276" width="292" height="16" rx="8" fill="#6E4C35"/>
          <path d="M262 278 q22 -18 40 -10" stroke="#6E4C35" stroke-width="8" fill="none" stroke-linecap="round"/>
          <ellipse cx="300" cy="262" rx="14" ry="8" fill="#5FA868" transform="rotate(-25 300 262)"/>
          <ellipse cx="34" cy="270" rx="15" ry="8" fill="#5FA868" transform="rotate(20 34 270)"/>
          <ellipse cx="60" cy="298" rx="13" ry="7" fill="#4E9258" transform="rotate(-15 60 298)"/>
          <g class="critter"><g class="critter-body">
            <polygon class="tuft" points="100,92 116,46 132,96" fill="var(--owl-dark)"/>
            <polygon class="tuft" points="188,96 204,46 220,92" fill="var(--owl-dark)"/>
            <path class="wing l" d="M86 150 q-28 50 -6 112 q20 -6 30 -40 z" fill="var(--owl-dark)"/>
            <path class="wing r" d="M234 150 q28 50 6 112 q-20 -6 -30 -40 z" fill="var(--owl-dark)"/>
            <ellipse cx="160" cy="180" rx="82" ry="98" fill="var(--owl)"/>
            <ellipse cx="160" cy="216" rx="52" ry="58" fill="var(--belly)"/>
            <g fill="none" stroke="#C9AE86" stroke-width="3" stroke-linecap="round"><path d="M140 200 l6 6 l6 -6"/><path d="M168 200 l6 6 l6 -6"/><path d="M154 222 l6 6 l6 -6"/><path d="M140 244 l6 6 l6 -6"/><path d="M168 244 l6 6 l6 -6"/></g>
            <circle cx="128" cy="138" r="38" fill="var(--face)"/><circle cx="192" cy="138" r="38" fill="var(--face)"/>

        const g = env(t+d, 0.02, len*0.6, len*0.35, 1);
        bp.connect(am); am.connect(g); g.connect(b);
        osc('square', 240, 190, t+d, len, bp, 1); osc('sawtooth', 480, 380, t+d, len, bp, 0.5);
      });
    },
    bunny(b, t){ // thump-thump-thump, then a squeak
      [0, 0.2, 0.4].forEach(d => {
        const g = env(t+d, 0.005, 0.02, 0.16, 1); g.connect(b);
        osc('sine', 260, 70, t+d, 0.18, g, 1); osc('triangle', 520, 140, t+d, 0.12, g, 0.5);
      });
      [0.7, 0.88].forEach(d => { const g = env(t+d, 0.01, 0.06, 0.08, 0.35); g.connect(b); osc('sine', 1700, 2500, t+d, 0.15, g, 1); });
    }
  };
  function voice(force){
    if ((!S.snd && !force) || !ctx || ctx.state !== 'running') return;
    ignoreFor(cur().ignore);
    SOUNDS[cur().id](getBus(), ctx.currentTime + 0.02);
  }
  function chime(){
    if (!S.snd || !ctx || ctx.state !== 'running') return;
    ignoreFor(1300);
    const t0 = ctx.currentTime + 0.02, b = getBus();
    [880, 1175, 1568].forEach((f,i) => { const g = env(t0+i*0.12, 0.02, 0.05, 0.43, 0.12); g.connect(b); osc('sine', f, f, t0+i*0.12, 0.55, g, 1); });
  }

  // ---------- state ----------
  let mode = 'idle'; // idle | live | paused | off
  let pFast = 0, level = NaN, lmax = -Infinity, eSum = 0, eT = 0, last = performance.now();
  let overSince = null, alarm = null, lastAlarmEnd = -1e9, awakeUntil = 0, voiceTimer = null;
  let wasIgnoring = false, owlState = 'idle', stars = 0, quietAcc = 0, act = '', lastAct = '', errKey = '', lastMsgKey = '';
  const running = () => mode === 'live';
  function resetStats(){ pFast = 0; lmax = -Infinity; eSum = 0; eT = 0; overSince = null; }

  async function startLive(){
    $('err').hidden = true; errKey = '';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error(), { name:'Unsupported' });
      await getCtx();
      stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser(); analyser.fftSize = 2048; tbuf = new Float32Array(analyser.fftSize);
      wire();
      stream.getAudioTracks().forEach(tr => tr.addEventListener('ended', () => { if (mode === 'live' || mode === 'paused') { stopAll(); showErr('errEnded'); } }));
      resetStats(); mode = 'live'; last = performance.now();
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){}
      updateUI();
    } catch(err) {
      const n = err && err.name;
      showErr(n === 'NotAllowedError' || n === 'SecurityError' ? 'errDenied' : n === 'NotFoundError' ? 'errNotFound' : 'errUnsupported');
    }
  }
  function stopAll(){
    if (stream) stream.getTracks().forEach(tr => tr.stop());
    try { src && src.disconnect(); } catch(e){}
    stream = null; src = null;
    try { wakeLock && wakeLock.release(); } catch(e){} wakeLock = null;
    if (alarm) endAlarm(performance.now());
    awakeUntil = 0; act = '';
    mode = 'off'; updateUI();
  }
  function showErr(k){ errKey = k; $('err').textContent = t(k); $('err').hidden = false; }
  $('go').addEventListener('click', () => { if (!running()) startLive(); });
  $('toggleRun').addEventListener('click', () => { running() || mode === 'paused' ? stopAll() : (closeSheet(), startLive()); });
  $('resetStars').addEventListener('click', () => { stars = 0; quietAcc = 0; renderStars(); });

  let hiddenAt = null;
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'hidden' && running()) {
      hiddenAt = Date.now(); if (alarm) endAlarm(performance.now()); awakeUntil = 0; mode = 'paused'; wakeLock = null; updateUI();
    } else if (document.visibilityState === 'visible') {
      if (ctx) { try { await ctx.resume(); } catch(e){} }
      if (mode === 'paused') { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){} mode = 'live'; pFast = 0; last = performance.now(); updateUI(); }
    }
  });

  // ---------- alarm ----------
  function fireAlarm(tm, Lv){
    alarm = { start: Date.now(), t0: tm, peak: Lv, muted: false };
    quietAcc = 0; awakeUntil = tm + 10000;
    const pool = cur().acts.filter(a => a !== lastAct); act = lastAct = pool[Math.floor(Math.random()*pool.length)];
    voice(); clearInterval(voiceTimer); voiceTimer = setInterval(() => { if (alarm && !alarm.muted) voice(); }, 3000);
    if (S.vib && canVibrate) { try { navigator.vibrate([250,120,250]); } catch(e){} }
    updateUI();
  }
  function endAlarm(tm){
    if (!alarm) return;
    clearInterval(voiceTimer);
    addLog(new Date(alarm.start).toLocaleTimeString(L, { hour:'2-digit', minute:'2-digit', second:'2-digit' }), alarm.peak, (tm - alarm.t0)/1000);
    alarm = null; lastAlarmEnd = tm; overSince = null; awakeUntil = Math.max(awakeUntil, tm + 2500);
    updateUI();
  }
  $('okBtn').addEventListener('click', () => { if (alarm) { alarm.muted = true; clearInterval(voiceTimer); updateUI(); } });
  function checkAlarm(tm, Lv){
    if (Lv >= S.thr) {
      if (overSince === null) overSince = tm;
      if (!alarm && tm - overSince >= S.hold*1000 && tm - lastAlarmEnd > 2000) fireAlarm(tm, Lv);
      if (alarm) alarm.peak = Math.max(alarm.peak, Lv);
    } else if (Lv < S.thr - 2) { overSince = null; if (alarm) endAlarm(tm); }
  }
  function addLog(when, peak, dur){
    $('logEmpty').hidden = true;
    const li = document.createElement('li');
    const a = document.createElement('span'); a.textContent = when + ' · ' + animalName(cur().id);
    const b = document.createElement('span'); b.className = 'p'; b.textContent = f1(peak) + (S.aw ? ' dB(A)' : ' dB');
    const c = document.createElement('span'); c.textContent = t('sec', { n:f1(dur) });
    li.append(a,b,c); $('log').prepend(li);
    while ($('log').children.length > 20) $('log').lastChild.remove();
  }

  // ---------- stars ----------
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--moon)" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
  function renderStars(pop){
    const row = $('starrow'); row.innerHTML = '';
    const show = Math.min(stars, 8);
    for (let i=0;i<show;i++){ const s = document.createElement('span'); s.innerHTML = STAR; s.style.display = 'inline-flex'; if (pop && i === show-1) s.className = 'pop'; row.appendChild(s); }
    if (stars > 8) { const m = document.createElement('span'); m.className = 'more'; m.textContent = '+' + f0(stars-8); row.appendChild(m); }
    if (stars === 0) { const m = document.createElement('span'); m.style.color = 'var(--ink-soft)'; m.textContent = t('none'); row.appendChild(m); }
    row.setAttribute('aria-label', t('starsAria', { n:f0(stars) }));
  }

  // ---------- UI ----------
  function setOwl(st){
    if (st !== 'awake') act = '';
    owlState = st;
    const cls = 'critter-svg st-' + st + (st === 'awake' && act ? ' act-' + act : '');
    if (curSvg().getAttribute('class') !== cls) curSvg().setAttribute('class', cls);
  }
  function texts(key){
    const a = animalText();
    switch (key) {
      case 'idle':   return [a.idle, t('idle2')];
      case 'sleep':  return [a.sleep, t('sleep2')];
      case 'peek':   return [a.peek, t('peek2')];
      case 'awake':  return [(act && a.act[act]) || t('awake1'), t('awake2')];
      case 'paused': return [t('paused1'), t('paused2')];
      default:       return [t('off1'), t('off2')];
    }
  }
  function updateUI(){
    let key = mode === 'paused' ? 'paused' : mode === 'off' ? 'off' : mode === 'idle' ? 'idle' : owlState;
    const full = key + ':' + act + ':' + idx;
    if (full !== lastMsgKey) { lastMsgKey = full; const [m, s] = texts(key); $('msg').textContent = m; $('sub').textContent = s; }
    document.body.classList.toggle('is-alarm', !!alarm);
    $('go').hidden = running() || mode === 'paused';
    $('go').textContent = mode === 'off' ? t('goOn') : t('go');
    $('okBtn').hidden = !(alarm && !alarm.muted);
    $('toggleRun').textContent = running() || mode === 'paused' ? t('stop') : t('start');
    if (!running() && mode !== 'paused') setOwl(mode === 'idle' ? 'idle' : 'sleep');
  }

  function loop(tm){
    const dt = Math.min(0.25, (tm - last)/1000); last = tm;
    if (running() && analyser) {
      if (tm < ignoreUntil) {
        // own sound is playing: hold the reading so the animal doesn't hear itself
        wasIgnoring = true;
        if (!alarm && owlState !== 'awake') quietAcc += dt;
        requestAnimationFrame(loop); return;
      }
      if (wasIgnoring) { wasIgnoring = false; overSince = null; if (isFinite(level)) pFast = Math.pow(10, (Math.min(level, S.thr - 3) - BASE_CAL - S.cal)/10); }
      const ms = meanSquare();
      pFast += (ms - pFast) * (1 - Math.exp(-dt/0.125));
      level = 10*Math.log10(Math.max(pFast,1e-12)) + BASE_CAL + S.cal;
      if (eT > 0.3) lmax = Math.max(lmax, level);
      eSum += ms * Math.pow(10, (BASE_CAL + S.cal)/10) * dt; eT += dt;
      checkAlarm(tm, level);

      let st;
      if (alarm || tm < awakeUntil) st = 'awake';
      else if (level >= S.thr - 8) st = 'peek';
      else if (owlState === 'peek' && level >= S.thr - 11) st = 'peek';
      else st = 'sleep';
      if (st !== owlState || (st === 'awake' && act && !curSvg().classList.contains('act-' + act))) { setOwl(st); updateUI(); }

      if (!alarm && st !== 'awake') {
        quietAcc += dt;
        if (quietAcc >= S.starMin*60) { quietAcc = 0; stars++; renderStars(true); chime(); }
      }
      $('nextRing').style.strokeDashoffset = String(88 * (1 - quietAcc/(S.starMin*60)));
      $('knob').style.left = pct(level) + '%';
      $('dbSmall').textContent = isFinite(level) ? f0(Math.round(level)) + (S.aw ? ' dB(A)' : ' dB') : '';
      if (!$('sheet').hidden) { $('nLvl').textContent = f1(level); $('nMax').textContent = f1(lmax); $('nEq').textContent = eT > 0 ? f1(10*Math.log10(eSum/eT)) : '–'; }
    }
    requestAnimationFrame(loop);
  }

  // ---------- swipe between animals ----------
  const track = $('trackA'), vp = $('viewport');
  const dots = ANIMALS.map((a,i) => { const d = document.createElement('button'); d.type = 'button'; d.className = 'dot'; d.addEventListener('click', () => goTo(i)); $('dots').appendChild(d); return d; });
  function goTo(i, animate = true){
    if (alarm) i = idx; // no switching while the alarm is on
    const prev = idx;
    idx = Math.max(0, Math.min(ANIMALS.length-1, i));
    track.style.transition = animate ? 'transform .38s cubic-bezier(.3,.8,.3,1)' : 'none';
    track.style.transform = `translateX(${-idx*100}%)`;
    if (prev !== idx) {
      svgs[prev].setAttribute('class', 'critter-svg ' + (running() ? 'st-sleep' : 'st-idle'));
      act = ''; lastAct = '';
      S.animal = cur().id; save();
      const keep = owlState; owlState = ''; setOwl(keep === 'awake' ? 'sleep' : (keep || 'idle'));
    }
    document.body.dataset.animal = cur().id;
    $('animalName').textContent = animalName(cur().id);
    dots.forEach((d,j) => { d.classList.toggle('on', j === idx); d.setAttribute('aria-label', animalName(ANIMALS[j].id)); });
    $('prevA').disabled = idx === 0; $('nextA').disabled = idx === ANIMALS.length-1;
    lastMsgKey = ''; updateUI();
  }
  $('prevA').addEventListener('click', () => goTo(idx-1));
  $('nextA').addEventListener('click', () => goTo(idx+1));
  let sx = null, sy = null, dx = 0, dragging = false;
  vp.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; dx = 0; dragging = false; });
  vp.addEventListener('pointermove', e => {
    if (sx === null) return;
    dx = e.clientX - sx;
    if (!dragging && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - sy)) { dragging = true; try { vp.setPointerCapture(e.pointerId); } catch(_){} }
    if (dragging && !alarm) { track.style.transition = 'none'; track.style.transform = `translateX(calc(${-idx*100}% + ${dx}px))`; }
  });
  const endDrag = () => {
    if (sx === null) return;
    if (dragging) { const w = vp.clientWidth || 1; goTo(dx < -w*0.18 ? idx+1 : dx > w*0.18 ? idx-1 : idx); }
    sx = null; dragging = false;
  };
  vp.addEventListener('pointerup', endDrag); vp.addEventListener('pointercancel', endDrag);
  document.addEventListener('keydown', e => { if ($('sheet').hidden && !e.target.closest('input,select')) { if (e.key === 'ArrowRight') goTo(idx+1); if (e.key === 'ArrowLeft') goTo(idx-1); } });

  // ---------- parent sheet (hold to open) ----------
  const gear = $('gear'); let holdTimer = null;
  const cancelHold = () => { clearTimeout(holdTimer); gear.classList.remove('holding'); };
  gear.addEventListener('pointerdown', e => { e.preventDefault(); gear.classList.add('holding'); holdTimer = setTimeout(() => { cancelHold(); openSheet(); }, 1200); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => gear.addEventListener(ev, cancelHold));
  gear.addEventListener('contextmenu', e => e.preventDefault());
  gear.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(); } });
  function openSheet(){ $('sheet').hidden = false; $('closeSheet').focus(); updateUI(); }
  function closeSheet(){ $('sheet').hidden = true; }
  $('closeSheet').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  applyLang();
  goTo(idx, false);
  $('knob').style.left = '0%';
  requestAnimationFrame(loop);
})();
</script>

</body>
